<!doctype html>
<html lang="lv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Vienkārša HTML kontaktu forma ar vārda, e-pasta un sūdzības laukiem."
    />
    <title>Forma</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Forma</h1>
    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Recusandae eaque
      laborum quasi ipsam eligendi culpa!
    </p>

    <p>Lorem ipsum dolor sit amet.</p>

    <form action="" method="get" class="form-example">
      <div class="form-example">
        <label for="name" lang="en">Enter your name:</label>
        <input type="text" name="name" id="name" autocomplete="name" required />
      </div>
      <div class="form-example">
        <label for="email" lang="en">Enter your email:</label>
        <input
          type="email"
          name="email"
          id="email"
          autocomplete="email"
          required
        />
      </div>
      <div class="form-example">
        <label for="sudzibas">rakstiet sūdzību:</label>
        <input type="text" name="sudzibas" id="sudzibas" required />
      </div>
      <div class="form-example">
        <input type="submit" value="Subscribe!" lang="en" />
      </div>
    </form>
    <script src="script.js"></script>
  </body>

</html>
